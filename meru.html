<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week09 登録</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-800">

    <header class="bg-white text-gray-90 text-5xl flex items-center justify-between max-w-auto mx-auto p-4">

        <h1 class="text-gray-900 font-bold text-xl md:text-3xl lg:text-5xl">登録</h1>

        <span class="bg-blue-200 text-blue-800 px-4 py-2 rounded-full font-bold text-xl md:text-3xl lg:text-4xl">Week09課題</span>

    </header>

    <div class="bg-white m-4 p-4 rounded text-center">

        <h1 class="text-gray-950 text-xl font-bold mb-6">ユーザー登録</h1>

        <form id="signupForm" class="space-y-4" novalidate>

            <!--名前-->

            <div>

                <label for="name" class="block text-sm font-medium text-gray-950 mb-1">お名前</label>

                <input type="text" id="name" required class="w-full border rounded px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="例：山田太郎">

            </div>

            <!--メールアドレス-->

            <div>

                <label for="email" class="block text-sm font-medium text-gray-950 mb-1">メールアドレス</label>

                <input type="email" id="email" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="例：example@mail.com">

            </div>

            <!--パスワード-->

            <div>

                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード（８文字以上）</label>

                <div class="flex gap-2">

                    <input type="password" id="password" required minlength="8" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">

                    <!--目のボタン-->

                    <button type="button" id="togglePassword" class="bg-gray-100 px-3 py-2 rounded hover:bg-gray-400">👀</button>

                </div>

            </div>

            <!--規約事項-->

            <div class="flex items-center gap-2">

                <input type="checkbox" id="agree" required>

                <label for="agree" class="text-sm text-gray-700">利用規約に同意する</label>

            </div>

            <p id="message" class="text-sm font-medium"></p>

            <!--登録ボタン-->

            <button type="submit" class="w-full bg-blue-500 text-gray-950 font-bold px-3 py-3 rounded hover:bg-blue-700">登録</button>
        
        </form>
    </div>

    <script>

        const form = document.getElementById("signupForm");
        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const agree = document.getElementById("agree");
        const message = document.getElementById("message");

        form.addEventListener("submit", (event) => {

            event.preventDefault();

            if (name.value === "") {
                message.textContent = "お名前を入力してください";
                return;
            }

            if (email.value === "") {
                message.textContent = "メールアドレスを入力してください";
                return;
            }

            if (!email.value.includes("@")) {
                message.textContent = "正しいメールアドレスを入力してください";
                return;
            }

            if (password.value.length < 8) {
                message.textContent = "パスワードは8文字以上にしてください";
                return;
            }

            if (!agree.checked) {
                message.textContent = "利用規約に同意してください";
                return;
            }

            message.textContent = "登録完了！";

        });

        const togglePassword = document.getElementById("togglePassword");

            togglePassword.addEventListener("click", () => {

                if (password.type === "password") {
                    password.type = "text";
                    togglePassword.textContent = "🙈";
                } else {
                    password.type = "password";
                    togglePassword.textContent = "👀";
                }

        });

    </script>

</body>
</html>
