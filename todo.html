<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week07 TODOリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-500">

    <header class="bg-white">
        <h1 class="text-4xl font-bold text-center p-4">📒TODOリスト</h1>
    </header>

    <div class="bg-white rounded m-10 p-4">

        <h2 class="text-4xl text-center">🐿リスト</h2>

        <div class="flex gap-2 p-4">

            <input id="todoInput" type="text" placeholder="タスクを入力してください" class="flex-1 border border-gray-300 rounded px-5 py-2">

            <button id="addBtn" class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">追加</button>

        </div>

        <ul id="todoList" class="space-y-2 text-2xl"></ul>

    </div>

    <script>
        const todoInput=document.querySelector("#todoInput")
        const addBtn=document.querySelector("#addBtn")
        const todoList=document.querySelector("#todoList")

        function addTodo() {
            const text=todoInput.value;

            if (text === "") {
                return;
            }

            const item=document.createElement("li")
            item.className="flex items-center justify-between bg-gray-50 rounded px-3 py-2"

            const span=document.createElement("span");
            span.textContent = text;

            const doneBtn = document.createElement("button");
            doneBtn.textContent = "完了";
            doneBtn.className = "text-sm text-gray-500 hover:text-red-500";

            doneBtn.addEventListener("click", () => {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "削除";
            deleteBtn.className = "text-sm text-red-500 hover:text-red-700";

            deleteBtn.addEventListener("click", () => {
                if (confirm("本当に削除しますか？")) {
                    item.remove();
                }
            });

            const buttonBox = document.createElement("div");
            buttonBox.className = "flex gap-3";

            buttonBox.appendChild(doneBtn);
            buttonBox.appendChild(deleteBtn);

            item.appendChild(span);
            item.appendChild(buttonBox);

            todoList.appendChild(item);
            todoInput.value = "";
        }

            addBtn.addEventListener("click", addTodo);

            todoInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    addTodo();
                }
        });

    </script>

</body>
</html>
