<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー情報</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-400">

    <h1 class="text-gray-950 text-5xl text-center font-bold m-10">GitHubユーザー検索</h1>

    <div class="bg-white rounded m-4 p-4">

        <label for="name"class="block text-sm font-medium text-gray-950 mb-1">GitHubユーザー名</label>

        <input type="text"id="name" required class="w-full border rounded px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400"placeholder="例：tanaka-maruo">

        <button id="searchButton" type="button"class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">検索</button>

    </div>

    <div id="userList" class="m-4 max-w-xs mx-auto"></div>

    <script>

        async function loadUsers(){
            const userList = document.getElementById("userList");
            const name = document.getElementById("name").value;

            try {

                const response = await fetch(
                    `https://api.github.com/users/${name}`
                );

                if (!response.ok) {
                    userList.textContent = "ユーザーが見つかりませんでした。";
                    return;
                }

                const user = await response.json();

                console.log(user);

                userList.innerHTML = `
                    <div class="bg-white rounded-lg p-6 shadow-md text-center">
                        <img src="${user.avatar_url}" class="w-32 h-32 rounded-full mx-auto">
                        <p>${user.name || user.login}</p>
                        <p>${user.bio || "自己紹介は、ありません。"}</p>
                        <p>フォロワー :${user.followers}人</p>
                    </div>
                `;

            } catch (error) {
                console.log(error);
            }

        }

        const searchButton = document.getElementById("searchButton");

        searchButton.addEventListener("click",loadUsers);

    </script>

</body>
</html>
