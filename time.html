<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week08 チーム（架空）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-800">

    <header class="bg-white flex items-center justify-between max-w-auto mx-auto p-6">
        <h1 class="text-gray-900 font-bold text-xl md:text-3xl lg:text-5xl">チーム（架空）</h1>
        <span class="bg-purple-200 text-purple-700 px-4 py-2 rounded-full font-bold text-xl md:text-3xl lg:text-5xl">Week08-課題</span>
    </header>

    <div class="flex justify-center gap-4 mb-6">

        <h1 class="text-xl md:text-3xl lg:text-5xl text-white p-8">チームメンバー</h1>

        <div class="relative">

            <button onclick="toggleMenu()" class="bg-white px-4 py-3 m-8 rounded-lg hover:bg-gray-400 text-2xl">☰</button>

            <div id="menu" class="hidden absolute top-full left-0 mt-2 bg-white rounded-lg shadow-lg p-2 w-40 z-10">

                <button onclick="showMembers('all'); toggleMenu()" class="block w-full text-left px-4 py-2 rounded hover:bg-gray-200">全員</button>

                <button onclick="showMembers('エンジニア'); toggleMenu()" class="block w-full text-left px-4 py-2 rounded hover:bg-gray-200">エンジニア</button>

                <button onclick="showMembers('教師'); toggleMenu()" class="block w-full text-left px-4 py-2 rounded hover:bg-gray-200">教師</button>

                <button onclick="showMembers('法律'); toggleMenu()" class="block w-full text-left px-4 py-2 rounded hover:bg-gray-200">法律</button>

                <button onclick="showMembers('職人'); toggleMenu()" class="block w-full text-left px-4 py-2 rounded hover:bg-gray-200">職人</button>

                <button onclick="showMembers('会社'); toggleMenu()" class="block w-full text-left px-4 py-2 rounded hover:bg-gray-200">会社</button>

            </div>

        </div>
    </div>

    <div id="memberList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto p-6"></div>

    <script>
        const members = [
            {name:"近木雄太", furigana:"ちかぎ ゆうた", role:"#建築家", comment:"家の設計に人一倍こだわっている"},

            {name:"饒舌美奇", furigana:"じょうぜつ みき",  role:"#弁護士", comment:"類まれな会話で無実へと導いている"},

            {name:"松本博文", furigana:"まつもと ひろふみ", role:"#エンジニア", comment:"ゲームを作るのが好き"},
            
            {name:"鏡辰涼音", furigana:"きょうしん すずね", role:"#教師", comment:"生徒に勉強を教えるのが好き"},
            
            {name:"金持丸穂", furigana:"きんもち まるお", role:"#取締役代表", comment:"優秀な人材に丸投げ"},
            
            {name:"理髪 匠", furigana:"りかみ たくみ", role:"#美容師", comment:"名前のように、匠のようにお客さんの髪を整えていく"},
            
            {name:"数理 拓真", furigana:"すうり たくま", role:"#教師", comment:"数学と理科を教えるのを得意としている"},
            
            {name:"法守 厳", furigana:"ほうもり げん", role:"#裁判官", comment:"法律を違反者を見逃さない"},
        ];

        const memberList = document.getElementById("memberList");

        function showMembers(role) {

            let filteredMembers;

            if (role === "all") {
                filteredMembers = members;
            } else if (role === "法律") {
                filteredMembers = members.filter(member => {
                    return member.role === "#弁護士" || member.role === "#裁判官";
                });

            } else if (role === "職人") {
                filteredMembers = members.filter(member => {
                    return member.role === "#建築家" || member.role === "#美容師";
                });

            } else if (role === "会社") {
                filteredMembers = members.filter(member => {
                    return member.role === "#取締役代表";
                });

            } else {
                filteredMembers = members.filter(member => {
                    return member.role === "#" + role;
                });

            }

            memberList.innerHTML = "";
                filteredMembers.forEach(member => {
                    const card = document.createElement("div");
                    card.className = "bg-white rounded-lg shadow p-4 m-4 text-center hover:shadow";

                    card.innerHTML = `
                        <p class="text-[10px] text-gray-500">${member.furigana}</p>
                        <h2 class="text-lg font-bold">${member.name}</h2>
                        <p class="text-blue-600 text-sm">${member.role}</p>
                        <p class="text-gray-600 mt-2">${member.comment}</p>
                    `;

                    memberList.appendChild(card);

                });
        }

        function toggleMenu() {
            const menu = document.getElementById("menu");
            menu.classList.toggle("hidden");
        }

        showMembers("all");


    </script>

</body>
</html>
